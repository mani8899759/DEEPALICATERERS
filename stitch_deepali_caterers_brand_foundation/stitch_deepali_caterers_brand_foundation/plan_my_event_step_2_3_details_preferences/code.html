<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Deepali Caterers - Plan My Event</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&amp;family=Playfair+Display:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary": "#000000",
                        "on-secondary": "#ffffff",
                        "surface": "#fdf8f8",
                        "on-secondary-fixed": "#2b1700",
                        "on-primary-container": "#858383",
                        "surface-dim": "#ddd9d8",
                        "surface-tint": "#5f5e5e",
                        "surface-bright": "#fdf8f8",
                        "surface-container": "#f1edec",
                        "error": "#ba1a1a",
                        "on-surface": "#1c1b1b",
                        "inverse-primary": "#c8c6c5",
                        "on-secondary-container": "#795932",
                        "surface-container-highest": "#e5e2e1",
                        "primary-container": "#1c1b1b",
                        "secondary-container": "#fed2a2",
                        "tertiary-fixed": "#ffdad6",
                        "on-error": "#ffffff",
                        "surface-container-low": "#f7f3f2",
                        "tertiary-fixed-dim": "#ffb3ad",
                        "on-tertiary-fixed-variant": "#8e1217",
                        "inverse-surface": "#313030",
                        "surface-variant": "#e5e2e1",
                        "on-error-container": "#93000a",
                        "on-tertiary-container": "#e3524d",
                        "on-surface-variant": "#444748",
                        "primary-fixed": "#e5e2e1",
                        "secondary": "#785832",
                        "on-tertiary-fixed": "#410003",
                        "secondary-fixed-dim": "#e9bf90",
                        "error-container": "#ffdad6",
                        "tertiary-container": "#410003",
                        "inverse-on-surface": "#f4f0ef",
                        "background": "#fdf8f8",
                        "outline-variant": "#c4c7c7",
                        "on-secondary-fixed-variant": "#5e411d",
                        "secondary-fixed": "#ffddb9",
                        "outline": "#747878",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#ebe7e6",
                        "on-primary-fixed-variant": "#474646",
                        "on-primary-fixed": "#1c1b1b",
                        "on-tertiary": "#ffffff",
                        "on-primary": "#ffffff",
                        "on-background": "#1c1b1b",
                        "primary-fixed-dim": "#c8c6c5",
                        "primary": "#000000"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin": "48px",
                        "md": "32px",
                        "gutter": "24px",
                        "sm": "16px",
                        "xs": "8px",
                        "lg": "64px",
                        "unit": "4px",
                        "xl": "128px"
                    },
                    "fontFamily": {
                        "label-caps": ["Manrope"],
                        "headline-xl": ["Playfair Display"],
                        "body-md": ["Manrope"],
                        "body-lg": ["Manrope"],
                        "headline-lg": ["Playfair Display"],
                        "display-lg": ["Playfair Display"],
                        "headline-lg-mobile": ["Playfair Display"],
                        "headline-md": ["Playfair Display"],
                        "headline-xl-mobile": ["Playfair Display"]
                    },
                    "fontSize": {
                        "label-caps": ["12px", { "lineHeight": "1.2", "letterSpacing": "0.15em", "fontWeight": "700" }],
                        "headline-xl": ["48px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "letterSpacing": "0.01em", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "display-lg": ["72px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "1.4", "fontWeight": "500" }],
                        "headline-xl-mobile": ["36px", { "lineHeight": "1.2", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .input-editorial {
            @apply w-full bg-transparent border-0 border-b border-primary/20 rounded-none px-0 py-2 font-body-lg text-body-lg text-on-surface focus:ring-0 focus:border-primary transition-colors placeholder:text-on-surface-variant/50;
        }
        .label-editorial {
            @apply block font-label-caps text-label-caps text-on-surface mb-2;
        }
        .btn-primary {
            @apply bg-primary text-on-primary font-label-caps text-label-caps uppercase px-8 py-4 hover:opacity-90 transition-opacity;
        }
        .btn-secondary {
            @apply bg-transparent border border-primary text-primary font-label-caps text-label-caps uppercase px-8 py-4 hover:bg-surface-variant transition-colors;
        }
        .radio-chip-input:checked + .radio-chip-label {
            @apply bg-primary text-on-primary border-primary;
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col font-body-md selection:bg-secondary-container selection:text-on-surface">
<!-- Top Navigation is suppressed as this is a transactional flow -->
<!-- Simple Header for Transactional Flow -->
<header class="w-full px-margin py-8 md:py-12 flex justify-between items-center border-b border-outline-variant max-w-[1440px] mx-auto">
<div class="font-display-lg text-headline-md font-bold tracking-tighter text-primary">
            DEEPALI CATERERS
        </div>
<button class="text-on-surface-variant hover:text-primary transition-colors flex items-center gap-2 font-label-caps text-label-caps uppercase">
<span class="material-symbols-outlined text-[18px]">close</span>
            Exit Booking
        </button>
</header>
<main class="flex-grow w-full max-w-[1440px] mx-auto px-6 md:px-margin py-12 md:py-24">
<!-- Progress Bar -->
<div class="max-w-2xl mx-auto mb-16">
<div class="flex justify-between items-center mb-4">
<span class="font-label-caps text-label-caps text-primary">Event Details</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">Step 2 of 4</span>
</div>
<div class="h-1 w-full bg-surface-variant relative">
<div class="absolute top-0 left-0 h-full bg-primary w-1/2 transition-all duration-500"></div>
</div>
</div>
<div class="grid grid-cols-1 lg:grid-cols-12 gap-gutter">
<!-- Main Content Area -->
<div class="lg:col-span-8 lg:col-start-3 max-w-3xl mx-auto w-full">
<h1 class="font-headline-xl text-headline-xl-mobile md:text-headline-xl text-primary mb-16 text-center">
                    Plan Your Gathering
                </h1>
<form class="space-y-16">
<!-- Section: Event Details -->
<section>
<h2 class="font-headline-md text-headline-md text-primary mb-8 border-b border-primary/10 pb-4">Event Specifics</h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-x-gutter gap-y-8">
<!-- Date -->
<div class="group">
<label class="label-editorial" for="event_date">Date of Event</label>
<div class="relative">
<input class="input-editorial" id="event_date" placeholder="DD/MM/YYYY" type="date"/>
</div>
</div>
<!-- Time -->
<div class="group">
<label class="label-editorial" for="event_time">Preferred Time</label>
<select class="input-editorial appearance-none bg-transparent" id="event_time">
<option disabled="" selected="" value="">Select a time block...</option>
<option value="morning">Morning (9 AM - 12 PM)</option>
<option value="afternoon">Afternoon (12 PM - 4 PM)</option>
<option value="evening">Evening (5 PM - 10 PM)</option>
<option value="late">Late Night (10 PM Onwards)</option>
</select>
</div>
<!-- Location -->
<div class="group md:col-span-2">
<label class="label-editorial" for="event_location">Venue Details</label>
<input class="input-editorial" id="event_location" placeholder="Enter venue name, address, or city" type="text"/>
</div>
<!-- Guest Count -->
<div class="group md:col-span-2">
<label class="label-editorial" for="guest_count">Estimated Guest Count</label>
<div class="flex items-center gap-4 mt-2">
<input class="w-full h-1 bg-surface-variant rounded-none appearance-none cursor-pointer accent-primary" id="guest_count" max="1000" min="10" step="10" type="range" value="100"/>
<span class="font-headline-md text-headline-md text-primary w-24 text-right" id="guest_count_display">100</span>
</div>
<p class="text-on-surface-variant text-sm mt-2 font-body-md">Final count can be adjusted closer to the date.</p>
</div>
</div>
</section>
<!-- Section: Food Preference -->
<section>
<h2 class="font-headline-md text-headline-md text-primary mb-8 border-b border-primary/10 pb-4">Culinary Direction</h2>
<label class="label-editorial mb-6">Menu Preference</label>
<div class="grid grid-cols-2 md:grid-cols-4 gap-4">
<!-- Vegetarian -->
<div class="relative">
<input class="peer sr-only radio-chip-input" id="pref_veg" name="food_pref" type="radio"/>
<label class="radio-chip-label flex flex-col items-center justify-center p-6 border border-outline-variant cursor-pointer transition-all hover:border-primary/50 text-center bg-surface-container-lowest" for="pref_veg">
<span class="material-symbols-outlined mb-3 text-[32px] font-light">eco</span>
<span class="font-label-caps text-label-caps uppercase">Vegetarian</span>
</label>
</div>
<!-- Non-Vegetarian -->
<div class="relative">
<input class="peer sr-only radio-chip-input" id="pref_nonveg" name="food_pref" type="radio"/>
<label class="radio-chip-label flex flex-col items-center justify-center p-6 border border-outline-variant cursor-pointer transition-all hover:border-primary/50 text-center bg-surface-container-lowest" for="pref_nonveg">
<span class="material-symbols-outlined mb-3 text-[32px] font-light">set_meal</span>
<span class="font-label-caps text-label-caps uppercase">Non-Veg</span>
</label>
</div>
<!-- Mixed -->
<div class="relative">
<input checked="" class="peer sr-only radio-chip-input" id="pref_mixed" name="food_pref" type="radio"/>
<label class="radio-chip-label flex flex-col items-center justify-center p-6 border border-outline-variant cursor-pointer transition-all hover:border-primary/50 text-center bg-surface-container-lowest" for="pref_mixed">
<span class="material-symbols-outlined mb-3 text-[32px] font-light">restaurant</span>
<span class="font-label-caps text-label-caps uppercase">Mixed</span>
</label>
</div>
<!-- Custom -->
<div class="relative">
<input class="peer sr-only radio-chip-input" id="pref_custom" name="food_pref" type="radio"/>
<label class="radio-chip-label flex flex-col items-center justify-center p-6 border border-outline-variant cursor-pointer transition-all hover:border-primary/50 text-center bg-surface-container-lowest" for="pref_custom">
<span class="material-symbols-outlined mb-3 text-[32px] font-light">draw</span>
<span class="font-label-caps text-label-caps uppercase">Custom</span>
</label>
</div>
</div>
<div class="mt-8 group">
<label class="label-editorial" for="dietary_notes">Special Dietary Requirements (Optional)</label>
<textarea class="input-editorial resize-none" id="dietary_notes" placeholder="E.g., Jain, Vegan, Gluten-free requirements..." rows="3"></textarea>
</div>
</section>
<!-- Navigation Actions -->
<div class="flex flex-col-reverse md:flex-row justify-between items-center gap-6 pt-12 border-t border-primary/10">
<button class="btn-secondary w-full md:w-auto" type="button">
                            Back
                        </button>
<button class="btn-primary w-full md:w-auto" type="button">
                            Continue to Menu Selection
                        </button>
</div>
</form>
</div>
</div>
</main>
<script>
        // Simple slider update logic
        const slider = document.getElementById('guest_count');
        const display = document.getElementById('guest_count_display');
        
        slider.addEventListener('input', function() {
            display.textContent = this.value + (this.value == 1000 ? '+' : '');
        });
    </script>
</body></html>
