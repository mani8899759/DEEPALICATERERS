<!DOCTYPE html>

<title>Deepali Caterers - Plan My Event</title>

<style>
        body {
            background-color: #FAE5CD;
            color: #121212;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .editorial-outline {
            border: 1px solid #121212;
        }
        .event-card {
            transition: all 0.3s ease;
        }
        .event-card:hover {
            background-color: #121212;
            color: #FAE5CD;
        }
        .event-card:hover .material-symbols-outlined {
            color: #FAE5CD;
        }
        /* Suppressing navigation as per instructions for a transactional/booking flow */
    </style>

<body>
<main class="flex-grow flex flex-col justify-center px-6 md:px-margin max-w-[1440px] mx-auto w-full py-xl">
<!-- Progress Indicator -->
<div class="mb-lg flex items-center justify-center space-x-4">
<div class="h-1 w-12 bg-primary"></div>
<div class="h-1 w-12 bg-primary/20"></div>
<div class="h-1 w-12 bg-primary/20"></div>
<div class="h-1 w-12 bg-primary/20"></div>
</div>
<div class="text-center mb-xl">
<h1 class="font-display-lg text-display-lg text-primary mb-sm">What are you celebrating?</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl mx-auto">
                Every occasion tells a story. Let us know what you're planning, and we'll help craft the perfect culinary narrative.
            </p>
</div>
<!-- Bento Grid for Options -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-xl max-w-5xl mx-auto w-full">
<button class="event-card group flex flex-col items-center justify-center p-12 editorial-outline bg-surface-container-lowest/50 backdrop-blur-sm cursor-pointer aspect-square md:aspect-auto">
<span class="material-symbols-outlined text-4xl mb-4 text-primary" style="font-variation-settings: 'FILL' 0;">diversity_2</span>
<span class="font-headline-md text-headline-md tracking-wide">Wedding</span>
</button>
<button class="event-card group flex flex-col items-center justify-center p-12 editorial-outline bg-surface-container-lowest/50 backdrop-blur-sm cursor-pointer aspect-square md:aspect-auto md:row-span-2">
<span class="material-symbols-outlined text-5xl mb-4 text-primary" style="font-variation-settings: 'FILL' 0;">local_bar</span>
<span class="font-headline-md text-headline-md tracking-wide">Reception</span>
</button>
<button class="event-card group flex flex-col items-center justify-center p-12 editorial-outline bg-surface-container-lowest/50 backdrop-blur-sm cursor-pointer aspect-square md:aspect-auto">
<span class="material-symbols-outlined text-4xl mb-4 text-primary" style="font-variation-settings: 'FILL' 0;">home</span>
<span class="font-headline-md text-headline-md tracking-wide">Housewarming</span>
</button>
<button class="event-card group flex flex-col items-center justify-center p-12 editorial-outline bg-surface-container-lowest/50 backdrop-blur-sm cursor-pointer aspect-square md:aspect-auto md:col-span-2">
<span class="material-symbols-outlined text-4xl mb-4 text-primary" style="font-variation-settings: 'FILL' 0;">groups</span>
<span class="font-headline-md text-headline-md tracking-wide">Family Function</span>
</button>
<button class="event-card group flex flex-col items-center justify-center p-12 editorial-outline bg-surface-container-lowest/50 backdrop-blur-sm cursor-pointer aspect-square md:aspect-auto">
<span class="material-symbols-outlined text-4xl mb-4 text-primary" style="font-variation-settings: 'FILL' 0;">more_horiz</span>
<span class="font-headline-md text-headline-md tracking-wide">Other</span>
</button>
</div>
<div class="flex justify-center">
<button class="bg-primary text-on-primary font-label-caps text-label-caps uppercase px-12 py-6 editorial-outline hover:bg-surface hover:text-primary transition-colors duration-300 flex items-center gap-4">
                Continue
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</div>
</main>
